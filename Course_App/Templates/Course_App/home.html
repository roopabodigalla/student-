<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Course Enrollment System</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      background-color: #4CAF50;
      color: white;
      padding: 30px;
    }

    nav {
      text-align: center;
      background-color: #ffffff;
      padding: 20px 0;
    }

    nav a {
      text-decoration: none;
      margin: 0 15px;
      font-size: 20px;
      color: #333;
      transition: all 0.3s ease;
    }

    nav a i {
      margin-right: 8px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      text-align: center;
      background-color: #e0f7fa;
      padding: 120px;
      border-radius: 10px;
      font-size: 20px;
    }

    footer {
      background-color: #333;
      padding: 10px;
      color: white;
      text-align: center;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

  <h1>Online Course Enrollment System</h1>

  <header>
    <nav>
      <a href="{% url 'course_list' %}">
        <i class="fas fa-book-open"></i> View Courses
      </a>
      <a href="{% url 'student_register' %}">
        <i class="fas fa-user-plus"></i> Register Student
      </a>
      <a href="{% url 'enroll_student' %}">
        <i class="fas fa-pen"></i> Enroll
      </a>
      <a href="{% url 'enrollments' %}">
        <i class="fas fa-list"></i> Enrollments
      </a>
    </nav>
  </header>

  <main>
    <h2>Welcome to the Online Course Enrollment System</h2>
    <p>Use the navigation above to manage students, courses, and enrollments.</p>
  </main>

  <footer>
    <p>&copy; 2025 Online Course System</p>
  </footer>

</body>
</html>
